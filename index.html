<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casino welcome bonuses</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#5c6370; --line:#d9dce1; --accent:#0a5c4a; --warn:#9a5b00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --fg:#eceef0; --muted:#9aa3ad; --line:#2b3036; --accent:#6fd3b6; --warn:#e0a84a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:56rem; margin:0 auto; padding:1.5rem 1rem 3rem; }
  h1 { font-size:1.5rem; margin:0 0 .25rem; }
  .meta { color:var(--muted); font-size:.9rem; margin:0 0 1.5rem; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:.75rem .5rem; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:.85rem; color:var(--muted); font-weight:600; }
  a { color:var(--accent); }
  .na { color:var(--muted); }
  .review { color:var(--warn); font-size:.85rem; display:block; }
  #status { color:var(--muted); }
  @media (max-width: 640px) {
    thead { position:absolute; left:-9999px; }
    tr { display:block; padding:.75rem 0; border-bottom:1px solid var(--line); }
    td { display:flex; justify-content:space-between; gap:1rem; border:0; padding:.25rem 0; }
    td::before { content:attr(data-label); color:var(--muted); flex:0 0 40%; }
  }
</style>
</head>
<body>
<main>
  <h1>Casino welcome bonuses</h1>
  <p class="meta" id="meta"></p>
  <p id="status">Loading…</p>
  <table id="table" hidden>
    <thead>
      <tr><th>Casino</th><th>Welcome bonus</th><th>Wagering</th><th>Min. deposit</th><th>Source</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
  const NA = "Not stated";

  function cell(label, content, isNa) {
    const td = document.createElement("td");
    td.dataset.label = label;
    if (content instanceof Node) td.appendChild(content);
    else td.textContent = content;
    if (isNa) td.classList.add("na");
    return td;
  }

  function render(data) {
    const rows = document.getElementById("rows");
    const list = data.casinos || [];
    if (!list.length) {
      document.getElementById("status").textContent =
        "No data yet. Run the scraper to generate data/bonuses.json.";
      return;
    }
    for (const c of list) {
      const tr = document.createElement("tr");

      const name = document.createElement("span");
      name.textContent = c.casino;
      if (c.needs_review) {
        const flag = document.createElement("span");
        flag.className = "review";
        flag.textContent = "Unverified: check at source";
        name.appendChild(flag);
      }
      tr.appendChild(cell("Casino", name));
      tr.appendChild(cell("Welcome bonus", c.welcome_bonus ?? NA, c.welcome_bonus == null));
      tr.appendChild(cell("Wagering",
        c.wagering_multiplier == null ? NA : c.wagering_multiplier + "x", c.wagering_multiplier == null));
      tr.appendChild(cell("Min. deposit", c.min_deposit ?? NA, c.min_deposit == null));

      if (/^https?:\/\//.test(c.source_url || "")) {
        const a = document.createElement("a");
        a.href = c.source_url;
        a.textContent = new URL(c.source_url).hostname;
        a.rel = "noopener noreferrer";
        a.target = "_blank";
        tr.appendChild(cell("Source", a));
      } else {
        tr.appendChild(cell("Source", NA, true));
      }
      rows.appendChild(tr);
    }
    if (data.generated_at) {
      document.getElementById("meta").textContent =
        "Last updated " + new Date(data.generated_at).toLocaleString();
    }
    document.getElementById("status").hidden = true;
    document.getElementById("table").hidden = false;
  }

  fetch("data/bonuses.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(() => {
      document.getElementById("status").textContent =
        "Could not load data/bonuses.json. If you opened this file directly, serve it over http: python -m http.server";
    });
</script>
</body>
</html>
